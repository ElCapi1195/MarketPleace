packages:
  - apps/*
  - packages/*
# Scripts de instalación: denegados salvo los listados. pnpm coloca su binario nativo, que turbo necesita.
allowBuilds:
  pnpm: true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': false
  '@prisma/engines': false
  prisma: false
# No añadir minimumReleaseAgeExclude: protege de versiones recién publicadas y comprometidas.
