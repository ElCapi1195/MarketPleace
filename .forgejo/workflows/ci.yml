name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: docker
    container: { image: node:24-bookworm }
    env: { VERTICAL: demo, NEXT_TELEMETRY_DISABLED: '1' }
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:core
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:dist
      - run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: docker
    container: { image: 'zricethezav/gitleaks:v8.24.0', options: --entrypoint "" }
    steps:
      - run: git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" repo && cd repo && git checkout "$GITHUB_SHA" && gitleaks git --redact .
