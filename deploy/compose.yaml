# Stack para Dokploy. Los secretos y la URL pública se definen como variables en Dokploy.
# Enrutado (Dokploy > Domains): Host(dominio) -> web:3000 y Host(dominio) + ruta /api -> api:3001.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  web:
    <<: *hardened
    image: marketplace-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    environment:
      VERTICAL: ${VERTICAL:?}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      API_INTERNAL_URL: http://api:3001
    networks: [dokploy-network, internal]
    mem_limit: 512m
    pids_limit: 200
    tmpfs: [/tmp, /app/apps/web/.next/cache:uid=1000]

  api:
    <<: *hardened
    image: marketplace-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VERTICAL: ${VERTICAL:?}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_URL: ${PUBLIC_URL:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-no-responder@localhost}
      DATABASE_URL: postgresql://marketplace_app:${APP_PASSWORD:?}@postgres:5432/marketplace
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      MEDIA_DIR: /data/media
      DOCUMENTS_DIR: /data/documents
    volumes: ['media:/data/media', 'documents:/data/documents']
    networks: [dokploy-network, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: 512m
    pids_limit: 200

  db-init:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL: postgresql://marketplace:${POSTGRES_PASSWORD:?}@postgres:5432/marketplace
      APP_PASSWORD: ${APP_PASSWORD:?}
    entrypoint: [sh, -ec]
    command:
      - |
        psql "$$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 --set=app_password="$$APP_PASSWORD" <<'SQL'
        SELECT CASE
          WHEN EXISTS (SELECT FROM pg_roles WHERE rolname = 'marketplace_app')
            THEN format('ALTER ROLE marketplace_app LOGIN PASSWORD %L', :'app_password')
          ELSE format('CREATE ROLE marketplace_app LOGIN PASSWORD %L', :'app_password')
        END
        \gexec
        SQL
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    pids_limit: 50

  migrate:
    image: marketplace-migrate:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: build
    command: [pnpm, --filter, '@marketplace/api', exec, prisma, migrate, deploy]
    environment:
      MIGRATION_DATABASE_URL: postgresql://marketplace:${POSTGRES_PASSWORD:?}@postgres:5432/marketplace
    networks: [internal]
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: 'no'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 200

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes: ['postgres-data:/var/lib/postgresql/data']
    networks: [internal]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    # noeviction: BullMQ perdería trabajos si Redis expulsara claves.
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDISCLI_AUTH" --maxmemory 96mb --maxmemory-policy noeviction --appendonly yes']
    volumes: ['redis-data:/data']
    networks: [internal]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  preview:
    image: nginx:stable-alpine3.24
    restart: unless-stopped
    user: '101:101'
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=755
      - /var/run:uid=101,gid=101,mode=755
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    ports:
      - '${PREVIEW_BIND_IP:?}:${PREVIEW_PORT:-4310}:8080'
    volumes: ['./preview.nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    # Keep internal service discovery and add the Dokploy bridge for LAN ingress.
    networks: [dokploy-network, internal]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    pids_limit: 100

volumes:
  postgres-data:
  redis-data:
  media:
  documents:

networks:
  internal:
    internal: true
  dokploy-network:
    external: true
